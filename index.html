<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore the Body - Anatameow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Patrick Hand', cursive;
            background-color: #ffffff;
        }

        .header {
            background-color: #d9cde2;
            padding: 10px 40px;
            color: white;
            border-bottom: 2px dashed #ffffff; /* Simplified wavy border */
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
        }

        .nav-left {
            text-align: center;
            font-size: 28px;
            line-height: 1.1;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .logo-container {
            text-align: center;
        }

        .logo-container img {
            width: 100px;
            height: auto;
        }
        
        .logo-container p {
            margin: -10px 0 0 0;
            font-size: 18px;
        }

        .nav-right {
            text-align: right;
            font-size: 16px;
        }
        
        .nav-right img {
            width: 16px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .main-content {
            padding: 40px 20px;
            background-color: #ffffff;
        }

        .systems-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .system-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 200px;
        }

        .system-card img {
            max-width: 150px;
            height: auto;
        }

        .system-card p {
            font-size: 22px;
            margin-top: 15px;
            line-height: 1;
        }

        /* Text colors for captions */
        .color-nervous { color: #bca9d3; }
        .color-circulatory { color: #e88989; }
        .color-respiratory { color: #97d4d9; }
        .color-digestive { color: #a4c99c; }
        .color-muscular { color: #e999ac; }

    </style>
</head>
<body>

    <header class="header">
        <nav class="nav-container">
            <div class="nav-left">Explore<br>the<br>Body</div>
            
            <div class="nav-center">
                <span>Systems</span>
                <span>Psych</span>
                <div class="logo-container">
                    <img src="images/logo.PNG" alt="Anatameow Logo">
                    <p>anatameow</p>
                </div>
                <span>Guides</span>

                    <span>Anatameow</span>
                </div>
                <div>Anatameow@gmail.com</div>
            </div>
        </nav>
    </header>

    <main class="main-content">

            <div class="system-card">

                <p class="color-nervous">Nervous<br>System</p>
            </div>
            <div class="system-card">

            <div class="system-card">

            <div class="system-card">

</html>
