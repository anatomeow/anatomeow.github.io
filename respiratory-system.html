<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiratory System - Anatomeow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/more-sugar" rel="stylesheet">
    <link rel="stylesheet" href="css/icons.min.css">
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body class="respiratory-page">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="detail-container">
            <!-- Icon Menu -->
            <div class="icon-menu-container">
                <button class="scroll-arrow left hidden" id="iconScrollLeft" onclick="scrollIconMenu('left')">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="scroll-arrow right hidden" id="iconScrollRight" onclick="scrollIconMenu('right')">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <div class="icon-menu-wrapper" id="iconMenuWrapper">
                    <div class="icon-menu" id="respiratoryIconMenu">
                        <!-- Icon menu will be built dynamically from JSON -->
                    </div>
                </div>
            </div>

            <h1 class="detail-title">Respiratory System</h1>
            <p class="detail-subtitle">The respiratory system’s primary function is to facilitate the exchange of gases—oxygen is brought into the body to support cellular metabolism, and carbon dioxide.</p>
                        
            <!-- Main Image -->
            <div class="main-image-container" id="imageContainer">
                <img id="respiratoryMainImage" class="main-image" src="images/respiratory.png" alt="Respiratory System Detail">
                <div class="zoom-controls" id="zoomControls">
                    <button class="zoom-btn zoom-in-btn" id="zoomInBtn" onclick="zoomIn()">
                        <i class="bi bi-plus"></i>
                    </button>
                    <button class="zoom-btn zoom-out-btn" id="zoomOutBtn" onclick="zoomOut()">
                        <i class="bi bi-dash"></i>
                    </button>
                    <button class="zoom-btn reset-btn" id="resetZoomBtn" onclick="resetZoom()">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
            
            <!-- Text Menu -->
            <div class="text-menu-container">
                <button class="scroll-arrow left hidden" id="textScrollLeft" onclick="scrollTextMenu('left')">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="scroll-arrow right hidden" id="textScrollRight" onclick="scrollTextMenu('right')">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <div class="text-menu-wrapper" id="textMenuWrapper">
                    <div class="text-menu" id="respiratoryTextMenu">
                        <div class="text-menu-item active" onclick="selectTextMenu(0)">Overview</div>
                    </div>
                </div>
            </div>
            
            <!-- Content Section -->
            <div class="content-section" id="respiratoryContent">
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <a href="index.html" class="btn-primary-custom">Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/common.js"></script>
    <script>
        // Load respiratory system data
        async function loadRespiratoryData() {
            try {
                const response = await fetch('data/respiratory-data.json');
                const data = await response.json();
                SystemPage.init('respiratory', data);
                console.log('Respiratory data loaded successfully');

                buildIconMenu();
                selectIcon(0);
            } catch (error) {
                console.error('Error loading respiratory data:', error);
            }
        }

        // Initialize page
        async function initPage() {
            await initSystemPage('respiratory', loadRespiratoryData);

            // Setup blank image detection (hides zoom controls for blank.png)
            setupBlankImageDetection('respiratory');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        // Initialize zoom functionality
        initImageZoom('respiratory');
    </script>
</body>
</html>
